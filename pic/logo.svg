<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="navyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a3a6b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="goldBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6914;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#C49B30;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#A07818;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <g transform="translate(40, 40)">
    <!-- Gear teeth (gold/bronze) - 12 teeth -->
    <g fill="url(#goldBronze)">
      <rect x="-3.5" y="-34" width="7" height="8" rx="1.5" transform="rotate(0)"/>
      <rect x="-3.5" y="-34" width="7" height="8" rx="1.5" transform="rotate(30)"/>
      <rect x="-3.5" y="-34" width="7" height="8" rx="1.5" transform="rotate(60)"/>
      <rect x="-3.5" y="-34" width="7" height="8" rx="1.5" transform="rotate(90)"/>
      <rect x="-3.5" y="-34" width="7" height="8" rx="1.5" transform="rotate(120)"/>
      <rect x="-3.5" y="-34" width="7" height="8" rx="1.5" transform="rotate(150)"/>
      <rect x="-3.5" y="-34" width="7" height="8" rx="1.5" transform="rotate(180)"/>
      <rect x="-3.5" y="-34" width="7" height="8" rx="1.5" transform="rotate(210)"/>
      <rect x="-3.5" y="-34" width="7" height="8" rx="1.5" transform="rotate(240)"/>
      <rect x="-3.5" y="-34" width="7" height="8" rx="1.5" transform="rotate(270)"/>
      <rect x="-3.5" y="-34" width="7" height="8" rx="1.5" transform="rotate(300)"/>
      <rect x="-3.5" y="-34" width="7" height="8" rx="1.5" transform="rotate(330)"/>
    </g>
    
    <!-- Gear ring -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#goldBronze)" stroke-width="4"/>
    
    <!-- Inner navy background -->
    <circle cx="0" cy="0" r="25" fill="url(#navyDark)"/>
    
    <!-- Compass rose - 4 cardinal points -->
    <polygon points="0,-23 -5,-6 0,-9 5,-6" fill="#1a3a6b"/>
    <polygon points="0,23 -5,6 0,9 5,6" fill="#2a5298"/>
    <polygon points="23,0 6,-5 9,0 6,5" fill="#2a5298"/>
    <polygon points="-23,0 -6,-5 -9,0 -6,5" fill="#1a3a6b"/>
    
    <!-- Compass rose - 4 intercardinal points -->
    <polygon points="16,-16 0,-4 -1,1 4,0" fill="#3a6ea5"/>
    <polygon points="16,16 4,0 -1,-1 0,4" fill="#4a7eb5" opacity="0.8"/>
    <polygon points="-16,16 0,4 1,-1 -4,0" fill="#3a6ea5"/>
    <polygon points="-16,-16 -4,0 1,1 0,-4" fill="#4a7eb5" opacity="0.8"/>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="4" fill="url(#goldBronze)" stroke="#0a1628" stroke-width="1"/>
    <circle cx="0" cy="0" r="2" fill="#D4AD3C"/>
  </g>
</svg>
